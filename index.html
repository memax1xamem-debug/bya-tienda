
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ByA - Tienda Online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #141014;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ff4fa3;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      color: #ff4fa3;
      letter-spacing: 3px;
    }

    .subtitulo {
      font-size: 14px;
      color: #ddd;
      margin-top: 5px;
    }

    .buscador {
      padding: 20px;
      text-align: center;
    }

    .buscador input {
      width: 100%;
      max-width: 500px;
      padding: 14px;
      border: 1px solid #ff4fa3;
      border-radius: 25px;
      background: #242024;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .banner {
      background: linear-gradient(135deg, #300020, #ff4fa3);
      padding: 45px 20px;
      text-align: center;
    }

    .banner h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .banner p {
      font-size: 16px;
    }

    .contenedor {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px;
    }

    h2 {
      color: #ff4fa3;
      margin-bottom: 20px;
    }

    .categorias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    .categoria {
      background: #242024;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid #553044;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }

    .producto {
      background: #242024;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #553044;
    }

    .producto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: white;
    }

    .producto-info {
      padding: 15px;
    }

    .producto h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .precio {
      color: #ff4fa3;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 12px;
      background: #ff4fa3;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:hover {
      background: #ff80bd;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #000;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ByA</div>
    <div class="subtitulo">
      Tu tienda de bienestar íntimo
    </div>
  </header>

  <div class="buscador">
    <input
      type="search"
      placeholder="Buscar productos..."
    >
  </div>

  <section class="banner">
    <h1>Bienvenidos a ByA</h1>
    <p>
      Descubrí nuestros productos.
      Comprá de forma fácil, segura y discreta.
    </p>
  </section>

  <main class="contenedor">

    <h2>Nuestras categorías</h2>

    <div class="categorias">
      <div class="categoria">Bienestar íntimo</div>
      <div class="categoria">Lubricantes</div>
      <div class="categoria">Accesorios</div>
      <div class="categoria">Kits y regalos</div>
    </div>

    <h2>Productos destacados</h2>

    <div class="productos" id="listaProductos">
    </div>

  </main>

  <footer>
    ByA © 2026 - Todos los derechos reservados
  </footer>

</body>
</html>
