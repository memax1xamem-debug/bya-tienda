
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ByA - Tienda Online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #141014;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ff4fa3;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      color: #ff4fa3;
      letter-spacing: 3px;
    }

    .subtitulo {
      font-size: 14px;
      color: #ddd;
      margin-top: 5px;
    }

    .buscador {
      padding: 20px;
      text-align: center;
    }

    .buscador input {
      width: 100%;
      max-width: 500px;
      padding: 14px;
      border: 1px solid #ff4fa3;
      border-radius: 25px;
      background: #242024;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .banner {
      background: linear-gradient(135deg, #300020, #ff4fa3);
      padding: 45px 20px;
      text-align: center;
    }

    .banner h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .banner p {
      font-size: 16px;
    }

    .contenedor {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px;
    }

    h2 {
      color: #ff4fa3;
      margin-bottom: 20px;
    }

    .categorias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    .categoria {
      background: #242024;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid #553044;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }

    .producto {
      background: #242024;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #553044;
    }

    .producto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: white;
    }

    .producto-info {
      padding: 15px;
    }

    .producto h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .precio {
      color: #ff4fa3;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 12px;
      background: #ff4fa3;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:hover {
      background: #ff80bd;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #000;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ByA</div>
    <div class="subtitulo">
      Tu tienda de bienestar íntimo
    </div>
  </header>

  <div class="buscador">
    <input
      type="search"
      placeholder="Buscar productos..."
    >
  </div>

  <section class="banner">
    <h1>Bienvenidos a ByA</h1>
    <p>
      Descubrí nuestros productos.
      Comprá de forma fácil, segura y discreta.
    </p>
  </section>

  <main class="contenedor">

    <h2>Nuestras categorías</h2>

    <div class="categorias">
      <div class="categoria">Bienestar íntimo</div>
      <div class="categoria">Lubricantes</div>
      <div class="categoria">Accesorios</div>
      <div class="categoria">Kits y regalos</div>
    </div>

    <h2>Productos destacados</h2>

    <div class="productos" id="listaProductos">
    </div>

  </main>

  <footer>
    ByA © 2026 - Todos los derechos reservados
  </footer>

<!-- FIREBASE - CATÁLOGO DE PRODUCTOS -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

// Configuración de Firebase ByA

const firebaseConfig = {
  apiKey: "AIzaSyDWluGdwdW6m-iHkt-VccB4FMm43LVKGh0",
  authDomain: "bya-tienda.firebaseapp.com",
  databaseURL: "https://bya-tienda-default-rtdb.firebaseio.com",
  projectId: "bya-tienda",
  storageBucket: "bya-tienda.firebasestorage.app",
  messagingSenderId: "727262057950",
  appId: "1:727262057950:web:92f7d76ea000ffd5be394f"
};

// Inicializar Firebase

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);

// Referencia a los productos

const productosRef = ref(database, "productos");

const listaProductos =
  document.getElementById("listaProductos");

// Mostrar productos en la tienda

onValue(productosRef, (snapshot) => {

  listaProductos.innerHTML = "";

  if (!snapshot.exists()) {
    listaProductos.textContent =
      "Próximamente tendremos nuevos productos.";
    return;
  }

  snapshot.forEach((productoSnapshot) => {

    const producto = productoSnapshot.val();

    const tarjeta = document.createElement("div");
    tarjeta.className = "producto";
    
// Mostrar fotografía del producto

const imagen = document.createElement("img");

if (producto.foto) {

  imagen.src = producto.foto;
  imagen.alt = producto.nombre || "Producto ByA";
  imagen.loading = "lazy";

  imagen.onerror = function() {
    imagen.style.display = "none";
  };

  tarjeta.appendChild(imagen);

}

    const info = document.createElement("div");
    info.className = "producto-info";

    const nombre = document.createElement("h3");
    nombre.textContent = producto.nombre || "Sin nombre";

    const descripcion = document.createElement("p");
    descripcion.textContent = producto.descripcion || "";

    const precio = document.createElement("p");
    precio.className = "precio";

    precio.textContent = Number(
      producto.precio || 0
    ).toLocaleString("es-AR", {
      style: "currency",
      currency: "ARS"
    });

    const stock = document.createElement("p");

    stock.textContent =
      Number(producto.stock || 0) > 0
        ? "Disponible"
        : "Sin stock";

// Botón para agregar al carrito

const botonCarrito = document.createElement("button");

botonCarrito.className = "boton";

botonCarrito.textContent = "🛒 Agregar al carrito";

botonCarrito.style.marginTop = "15px";

// Desactivar botón si no hay stock

if (Number(producto.stock || 0) <= 0) {

  botonCarrito.disabled = true;

  botonCarrito.textContent = "Sin stock";

}
    
    info.append(
  nombre,
  descripcion,
  precio,
  stock,
  botonCarrito
);
  
    tarjeta.appendChild(info);

    listaProductos.appendChild(tarjeta);

  });

}, (error) => {

  console.error("Error al cargar productos:", error);

  listaProductos.textContent =
    "No se pudieron cargar los productos.";

});

</script>
  
</body>
</html>
